name: Local candidate Windows validation

on:
  push:
    branches: [codex/local-release-candidate]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: local-candidate-windows
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt reportlab==5.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate with temporary synthetic data
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/validate_local_release.py --output "$env:RUNNER_TEMP/pharmacy-validation"
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$env:RUNNER_TEMP/pharmacy-validation" -Filter *.log | ForEach-Object {
              Write-Output "--- $($_.Name) ---"
              Get-Content $_.FullName -Tail 60
            }
            exit 1
          }
      - name: Smoke test embedded Windows Python (no installer publication)
        shell: pwsh
        env:
          PHARM_DATA_DIR: ${{ runner.temp }}\pharm-embedded-check
          PHARM_DB_PATH: ${{ runner.temp }}\pharm-embedded-check\synthetic.db
          PHARM_UPLOAD_DIR: ${{ runner.temp }}\pharm-embedded-check\uploads
          PHARM_BACKUP_DIR: ${{ runner.temp }}\pharm-embedded-check\backups
          PHARM_PRINTER: none
          ANTHROPIC_API_KEY: ""
          PYTHONUTF8: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'pharmacy-embedded-build'
          New-Item -ItemType Directory -Path $bundle | Out-Null
          $v = python -c "import platform; print(platform.python_version())"
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile "$bundle/python.zip"
          Expand-Archive "$bundle/python.zip" -DestinationPath "$bundle/python"
          $pth = Get-ChildItem "$bundle/python" -Filter 'python*._pth' | Select-Object -First 1
          $lines = (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site'
          $lines += 'Lib\site-packages'
          $lines += '..\program'
          Set-Content $pth.FullName $lines
          python -m pip install -r requirements.txt --target "$bundle/python/Lib/site-packages" --only-binary=:all: --no-compile
          git archive --format=zip HEAD -o "$bundle/program.zip"
          Expand-Archive "$bundle/program.zip" -DestinationPath "$bundle/program"
          & "$bundle/python/python.exe" "$bundle/program/manage.py" selftest --quick
          & "$bundle/python/python.exe" "$bundle/program/manage.py" init --pharmacy synthetic --username synthetic-owner --password ([guid]::NewGuid().ToString())
          & "$bundle/python/python.exe" "$bundle/program/manage.py" verify
      - name: Preserve synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-candidate-windows-validation
          path: ${{ runner.temp }}/pharmacy-validation/
          if-no-files-found: warn
          retention-days: 7
