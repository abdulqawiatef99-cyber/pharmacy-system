name: Windows installer

# main is the pharmacy update channel (the in-app updater pulls main), so main only
# moves with the owner's approval. Only a push to main publishes "installer-latest";
# a manual run on any other branch builds a review installer artifact and publishes nothing.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  # Publish gate: a push to main builds and publishes only if it is the merge of a PR whose
  # "CI / linux" passed (free substitute for branch protection; see branch-guard.yml).
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verify the push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: .github/scripts/verify_push.sh

  build:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pillow's Windows wheels have raqm (Arabic shaping) but load FriBiDi at run time; without it the
      # receipt cannot be drawn and the drawer never opens (trial 2026-10-29, #36). Built from source by
      # vcpkg (preinstalled on the runner), shipped next to python.exe, where Pillow looks for it.
      - name: FriBiDi for Arabic shaping
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install fribidi:x64-windows
          $dll = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" -Filter "fribidi*.dll"
          if (-not $dll) { throw "fribidi dll not built" }
          New-Item -ItemType Directory fribidi -Force | Out-Null
          $dll | Copy-Item -Destination fribidi
          Get-ChildItem fribidi
          # the Python that runs the tests gets it too, so the printing tests run on Windows instead of skipping
          Copy-Item fribidi\* (Split-Path (Get-Command python).Source)

      - name: Tests (Windows)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ErrorActionPreference = 'Continue'
          python -m unittest discover -s tests -t . *> test-out.txt
          $code = $LASTEXITCODE
          Get-Content test-out.txt -Tail 5
          if ($code -ne 0) {
            # the failures as one annotation, readable from the API when the log itself is not reachable
            $start = (Select-String -Path test-out.txt -Pattern '^(=+|FAIL:|ERROR:)' | Select-Object -First 1).LineNumber
            $txt = (Get-Content test-out.txt | Select-Object -Skip ([Math]::Max(0, $start - 1)) -First 150) -join '%0A'
            Write-Output "::error title=Windows tests::$txt"
            exit 1
          }

      - name: Embedded Python + libraries
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $v = python -c "import platform; print(platform.python_version())"
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath build/python
          $pth = Get-ChildItem build/python -Filter "python*._pth" | Select-Object -First 1
          $lines = (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site'
          $lines += 'Lib\site-packages'
          $lines += '..\program'
          Set-Content $pth.FullName $lines
          python -m pip install -r requirements.txt --target build/python/Lib/site-packages --only-binary=:all: --no-compile
          Copy-Item fribidi\* build/python

      - name: Program files
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory build/program | Out-Null
          # LF line ends, byte for byte what GitHub's update archive holds: the runner's git turns LF into
          # CRLF (core.autocrlf), and the update check then saw every update as a dependency change (B13)
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip HEAD -o program.zip
          Expand-Archive program.zip -DestinationPath build/program
          # what this installer contains: the launcher adopts it once over an older in-app update (#45),
          # and the update badge compares it with main
          $commitTime = [long](git show -s --format=%ct HEAD)
          @{ sha = "$env:GITHUB_SHA"; ref = "$env:GITHUB_REF_NAME"; commit_time = $commitTime } | ConvertTo-Json -Compress |
            Set-Content -Encoding ascii build/program/build_info.json

      - name: Smoke test of the embedded build
        shell: pwsh
        env:
          PHARM_DATA_DIR: ${{ runner.temp }}\pharm-smoke
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          # every shipped library imports in the embedded runtime (win32print = Windows printer queue)
          build/python/python.exe -c "import win32print, PIL, pdfplumber, openpyxl, starlette, uvicorn, multipart, requests, httpx"
          # Arabic shaping works in the shipped runtime (direct receipt printing + labels depend on it)
          build/python/python.exe -c "from PIL import features; assert features.check('raqm') and features.check('fribidi'), 'raqm/fribidi missing'"
          build/python/python.exe -c "import sys; sys.path.insert(0, 'build/program'); from app.printing import escpos; print(escpos.render_receipt([('title', '\u0635\u064a\u062f\u0644\u064a\u0629', ''), ('row', '\u0628\u0627\u0646\u0627\u062f\u0648\u0644', '40.00')]).size)"
          build/python/python.exe build/program/manage.py selftest --quick
          build/python/python.exe build/program/manage.py init --pharmacy smoke --username owner --password Smoke-Pass-2026
          build/python/python.exe build/program/manage.py verify
          # R8 on Windows with a generated test key in a temporary installation.
          build/python/python.exe -c "import sys; sys.path.insert(0, 'build/program'); import unittest; unittest.main(module='tests.test_smart_update', argv=['unittest', 'TestApply'])"
          build/python/python.exe build/program/manage.py verify

      # #100: labels through the Windows printer driver, printed for real (into a file) with the shipped runtime
      - name: Driver label smoke test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          build/python/python.exe build/program/scripts/ci/driver_print_smoke.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ github.run_number }}
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\pharmacy.iss

      - name: Sign the production installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          INSTALLER_SIGNING_PFX: ${{ secrets.INSTALLER_SIGNING_PFX }}
          INSTALLER_SIGNING_PASSWORD: ${{ secrets.INSTALLER_SIGNING_PASSWORD }}
          INSTALLER_SIGNER_SHA256: ${{ vars.INSTALLER_SIGNER_SHA256 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          if (-not $env:INSTALLER_SIGNING_PFX -or $env:INSTALLER_SIGNER_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'Production installer signing material is unavailable.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'installer-signer.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:INSTALLER_SIGNING_PFX))
            $password = ConvertTo-SecureString $env:INSTALLER_SIGNING_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object { $_.HasPrivateKey -and $_.GetCertHashString('SHA256') -eq $env:INSTALLER_SIGNER_SHA256 } |
              Select-Object -First 1
            if (-not $certificate) { throw 'Installer signer fingerprint does not match.' }
            $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin/*/x64/signtool.exe'
            $signTool = Get-ChildItem $sdk |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw 'Windows SDK signing tool is unavailable.' }
            & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 dist/PharmacySetup.exe
          } finally {
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" }
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # Artifact storage is small on GitHub Free (#122): keep review builds 14 days, not 90.
      # The artifact is only a convenience copy: a push to main delivers "installer-latest"
      # and a manual review build delivers the "installer-review" pre-release below (release
      # assets do not count against the Actions storage quota), so a full quota blocks neither.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PharmacySetup
          path: dist/PharmacySetup.exe
          retention-days: 14

      - name: Publish review build as pre-release "installer-review"
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hash = (Get-FileHash dist/PharmacySetup.exe -Algorithm SHA256).Hash.ToLower()
          gh release delete installer-review --yes --cleanup-tag 2>$null
          gh release create installer-review dist/PharmacySetup.exe --prerelease --title "منصة الصيدلية — نسخة تجربة" --notes "نسخة تجربة من فرع ${{ github.ref_name }} (${{ github.sha }})، تشغيلة ${{ github.run_id }}. sha256: $hash" --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish as release "installer-latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_SIGNER_SHA256: ${{ vars.INSTALLER_SIGNER_SHA256 }}
        run: |
          $signature = Get-AuthenticodeSignature dist/PharmacySetup.exe
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.GetCertHashString('SHA256') -ne $env:INSTALLER_SIGNER_SHA256) {
            throw 'The published installer must have the pinned Authenticode signature.'
          }
          gh release delete installer-latest --yes --cleanup-tag 2>$null
          gh release create installer-latest dist/PharmacySetup.exe --title "منصة الصيدلية — آخر نسخة" --notes "ملف التثبيت لآخر نسخة على main (${{ github.sha }}). بياناتك محفوظة في %LOCALAPPDATA%\PharmacyPlatform ومش بتتلمس عند إعادة التثبيت." --target ${{ github.sha }}
