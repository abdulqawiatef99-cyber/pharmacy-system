name: Launch night e2e

# #113: the two launch-night scripts (scripts/windows/launch-fresh-start.bat, estock-import.bat) touch the
# pharmacy's real data folder, so they are run for real here on Windows, on synthetic data in a throw-away
# profile (tests/test_launch_night_e2e_windows.py). Only when those files change and the PR has the label
# "ci" (GitHub minutes, OWNER_RULES §4), or on demand.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "scripts/windows/launch-fresh-start.bat"
      - "scripts/windows/estock-import.bat"
      - "tests/test_launch_night_e2e_windows.py"
      - ".github/workflows/launch-night-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-night-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-scripts:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run both scripts on synthetic data
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PHARM_BAT_E2E: "1"
        run: |
          python -m unittest -v tests.test_launch_night_e2e_windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
