name: CI

# Required check for every PR. Never builds or publishes an installer.
# Linux runs on every PR/push; Windows (2x minutes) only where it matters:
# PRs into main, pushes to develop, or on demand.

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No data files or secrets in the repository
        run: python scripts/check_secrets.py $(git ls-files)
      - name: Install
        run: python -m pip install -r requirements.txt reportlab==5.1.0
      - name: Tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t .

  windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.base_ref == 'main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt reportlab==5.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated release validation (tests + selftest/init/verify on temporary data)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/validate_local_release.py --output "$env:RUNNER_TEMP/pharmacy-validation"
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$env:RUNNER_TEMP/pharmacy-validation" -Filter *.log | ForEach-Object {
              Write-Output "--- $($_.Name) ---"
              Get-Content $_.FullName -Tail 60
            }
            exit 1
          }
