name: CI

# Required check for every PR. Never builds or publishes an installer.
# Minutes (GitHub Free: 2,000 a month, Windows counts 2x; they ran out on 12/11 after 435 runs):
# - a PR runs CI only once it carries the label "ci" (the agent adds it when the head is final and the
#   full suite passed locally); later pushes to a labelled PR run again. Unlabelled pushes run nothing.
# - docs-only changes run the linux job without the test steps (the branch guard still sees "linux" green).
# - Windows runs on PRs into main, on demand, and on pushes to develop that touch Windows-relevant files.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Only an event that will run joins the shared group (and cancels the older run): an unlabelled push or an
# unrelated label gets a group of its own, so it never cancels a running "ci" validation.
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' ||
         (contains(github.event.pull_request.labels.*.name, 'ci') &&
          (github.event.action != 'labeled' || github.event.label.name == 'ci')))
        && format('ci-{0}', github.ref) || format('ci-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! files=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "windows=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^(app/printing/|installer/|scripts/windows/|launcher\.py|release_bootstrap\.py|release_protocol\.json|requirements|app/migrations/|app/core/(updater|backup|autobackup)\.py|\.github/workflows/)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"; else echo "windows=false" >> "$GITHUB_OUTPUT"; fi

  linux:
    needs: changes
    runs-on: ubuntu-24.04
    # the suite takes 11-13 minutes on the runner (22/11: 12m50s): 15 cut a green run; 25 leaves room (U4-5)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No data files or secrets in the repository
        run: python scripts/check_secrets.py $(git ls-files)
      # The release BEFORE 0.4 (main until 21/11), which writes the old-format backup (test_legacy_restore) and the
      # per-batch 99.99 sales (test_legacy_split_refund). Pinned: since v0.4.0 is on main, main no longer writes
      # them, and every PR went red (update 1).
      - name: Old release source (writes the old-format backup and sales for the legacy tests)
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          ref: 25328e3c7851d68e3154eaf5315d1962051220e2
          path: _release
          persist-credentials: false
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Browser for the UI tests (Node Playwright + Chromium, pinned)
        if: needs.changes.outputs.code == 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          bash scripts/ci/install_browser.sh "$RUNNER_TEMP/pw/node_modules/.bin/playwright"
      - name: Tests
        if: needs.changes.outputs.code == 'true'
        env:
          PYTHONUTF8: "1"
          PHARM_RELEASE_SRC: ${{ github.workspace }}/_release
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PHARM_REQUIRE_BROWSER: "1"   # a missing browser fails here instead of skipping (#70)
        run: python -m unittest discover -s tests -t .

  windows:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || github.base_ref == 'main' ||
      (github.event_name == 'push' && needs.changes.outputs.windows == 'true')
    runs-on: windows-2025
    # the validator stops the tests at 30 minutes (scripts/validate_local_release.py); the rest needs a few more
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated release validation (tests + selftest/init/verify on temporary data)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'pharmacy-validation'
          $stdout = Join-Path $env:RUNNER_TEMP 'validate-stdout.log'
          python scripts/validate_local_release.py --output $out *>&1 | Tee-Object -FilePath $stdout
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Job logs are not reachable from agent sessions, so the failure goes into annotations
            # (readable through the API), one per log that has a failure line.
            $emitted = 0
            $logs = @(Get-Item $stdout) + @(Get-ChildItem $out -Filter *.log -ErrorAction SilentlyContinue)
            foreach ($f in $logs) {
              if ($f.FullName -ne $stdout) {
                Write-Output "--- $($f.Name) ---"
                Get-Content $f.FullName -Tail 60
              }
              $lines = @(Get-Content $f.FullName)
              $hit = $lines | Select-String -Pattern '^(FAIL:|ERROR:|Traceback)|FAILED|\bFAIL\b' | Select-Object -First 1
              if (-not $hit) { continue }
              $txt = ($lines | Select-Object -Skip ($hit.LineNumber - 1) -First 150) -join "`n"
              $txt = $txt.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows validation $($f.BaseName)::$txt"
              $emitted++
            }
            if ($emitted -eq 0) {
              Write-Output "::error title=Windows validation::exit code $code; no failure line found in the logs"
            }
            exit 1
          }
